<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet"
            href="/Users/ehr/repos/5question-quiz/resource/style.css">
         <script 
            src="/Users/ehr/repos/5question-quiz/resource/script.js" 
            defer></script>
        <title>Quiz</title>
    </head>
    <body>
<!-- details -->
        <div id="first">
            <div id="nGSubmitDiv">
                <h3 align="center">Your Details : </h3>
                <div class="nGSubmit">
                    <input type="text" class="nGSubmit" id="nGSubmitName"
                        placeholder="Name"><br><br>
                </div>
                <div class="nGSubmit">
                    <input type="text" class="nGSubmit"  id="nGSubmitGmail"
                        placeholder="Gmail"><br><br>
                </div>
                <div class="nGSubmit"> 
                    <button id="startButton">Start</button>
                </div>
            </div>
        </div>
<!-- first question -->
        <div id="second">
            <div id="qOneDiv">
                <div class="qOne">
                    <h3>What is the capital of India?</h3>
                </div>
                <div class="qOne">
                    <input type="text" class="qOne"
                        placeholder="Answer">
                </div>
                <div class="qOne">
                    <button class="next">Next</button>
                </div>
            </div>
        </div>
<!-- second question -->
        <div id="third">
            <div id="qTwoDiv">
                <div class="qTwo">
                    <h3>Where is the Arabian Sea located</h3>
                </div>
                <div class="qTwo">
                    <input type="text" class="qTwo"
                        placeholder="Answer">
                </div>
                <div class="qTwo">
                    <button class="next">Next</button>
                </div>
            </div>
        </div>
    </body>
</html>
